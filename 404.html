<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Mustafa Elnaiem Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1628;
            --secondary: #1d4ed8;
            --accent: #38bdf8;
            --background: #f8fafc;
            --text: #0f172a;
            --gray-500: #64748b;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        .error-container {
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: var(--secondary);
            line-height: 1;
            margin-bottom: 16px;
        }
        
        .error-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .error-message {
            font-size: 1.1rem;
            color: var(--gray-500);
            margin-bottom: 32px;
            line-height: 1.7;
        }
        
        .back-link {
            display: inline-block;
            padding: 14px 32px;
            background: var(--secondary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .back-link:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you're looking for doesn't exist or has been moved. 
            Let's get you back to exploring intelligent systems and EdTech innovations.
        </p>
        <a href="{{ '/' | relative_url }}" class="back-link">Back to Portfolio</a>
    </div>
</body>
</html>
