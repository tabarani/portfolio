about:
  title: "Creative engineer and EdTech innovator."
  lead: "I build practical institutional platforms that combine backend rigor, operational clarity, and privacy-aware AI."
  paragraphs:
    - "I work as a Senior Software Developer in Madinah, where I design and develop institutional software across Moodle, Gibbon, custom APIs, analytics, identity, and operational workflows. My focus is on systems that are maintainable, audit-ready, and useful to the people who run schools and higher-education operations every day."
    - "As the sole engineer behind multiple production and case-study systems, I have built role-aware dashboards, on-premise AI assistants, identity reconciliation services, finance workflows, reporting pipelines, and integrations that connect LMS, SIS, directory, and messaging layers without losing control of privacy or permissions."
    - "I hold a Master of Science in Computer Science and bring a strong preference for structure to every project—from Clean Architecture and bounded workflows to bilingual user experiences, technical documentation, and compliance-conscious data design."
  yulpana_url: "https://www.yulpana.com"
  yulpana_button_text: "Visit Yulpana EdTech"
  focus_title: "Currently focused on"
  focus_items:
    - "Building on-premise AI assistants with role-aware retrieval, source attribution, and institution-specific workflow prompts."
    - "Designing backend and integration layers that connect Moodle, Gibbon, directory services, and custom applications."
    - "Embedding auditability, approvals, and privacy controls into identity, finance, and reporting workflows."
    - "Applying Clean Architecture, CQRS, and explicit workflow modeling to long-lived institutional systems."
    - "Turning operational school data into usable dashboards and action-oriented decision support."

