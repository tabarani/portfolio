<section class="contact section" id="contact">
    <div class="container">
        <h2 class="section-title">{{ site.data.settings.contact.title }}</h2>
        <p class="contact-subtitle">{{ site.data.settings.contact.subtitle }}</p>
        <div class="contact-grid" role="list">
            {% for item in site.data.settings.contact.items %}
            <a href="{% if item.type == 'cv' %}{{ item.url | relative_url }}{% else %}{{ item.url }}{% endif %}" {% if item.type != 'cv' %}target="_blank" rel="noopener"{% endif %} class="contact-item" aria-label="{{ item.label }}" role="listitem">
                {% case item.type %}
                {% when 'email' %}
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true" class="contact-icon-svg">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16v12H4z"/>
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m4 7 8 6 8-6"/>
                </svg>
                {% when 'github' %}
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true" class="contact-icon-svg">
                    <path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.93.85.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.32 9.32 0 0 1 12 6.95c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.95.68 1.92 0 1.38-.01 2.5-.01 2.84 0 .27.18.59.69.49A10.15 10.15 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"/>
                </svg>
                {% when 'linkedin' %}
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true" class="contact-icon-svg">
                    <path fill="currentColor" d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v10.5H3V9.75Zm6.25 0h3.84v1.43h.05c.54-1.02 1.85-1.68 3.8-1.68 4.06 0 4.81 2.67 4.81 6.15v4.6h-4v-4.08c0-.97-.02-2.23-1.36-2.23-1.36 0-1.57 1.06-1.57 2.16v4.15h-4V9.75Z"/>
                </svg>
                {% when 'telegram' %}
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true" class="contact-icon-svg">
                    <path fill="currentColor" d="M21.82 4.24c.25-1.14-.82-1.64-1.73-1.27L2.7 9.67c-1.18.46-1.16 1.12-.2 1.41l4.45 1.39 10.32-6.5c.49-.3.93-.14.57.18l-8.36 7.55-.32 4.73c.47 0 .68-.22.94-.48l2.26-2.2 4.7 3.47c.87.48 1.49.23 1.7-.8l3.06-14.18Z"/>
                </svg>
                {% when 'website' %}
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true" class="contact-icon-svg">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 0c2.5 2.7 3.8 6 3.8 10S14.5 19.3 12 22m0-20C9.5 4.7 8.2 8 8.2 12s1.3 7.3 3.8 10M2.8 8h18.4M2.8 16h18.4"/>
                </svg>
                {% endcase %}
            </a>
            {% endfor %}
        </div>
    </div>
</section>
