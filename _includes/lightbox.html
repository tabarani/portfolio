<div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous image">&#8249;</button>
    <button class="lightbox-nav lightbox-next" aria-label="Next image">&#8250;</button>
    <div class="lightbox-counter" id="lightbox-counter">1 / 3</div>
    <div class="lightbox-content">
        <div class="lightbox-img-wrapper" id="lightbox-img-wrapper">
            <!-- Image or placeholder injected here by JS -->
        </div>
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
    <div class="lightbox-thumbnails" id="lightbox-thumbnails">
        <!-- Thumbnails injected here by JS -->
    </div>
</div>
