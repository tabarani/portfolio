---
layout: default
---

<article class="blog-post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
      {% if page.tags %}
        <span class="post-tags">
          {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>
          {% endfor %}
        </span>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}" class="back-link">&larr; Back to Portfolio</a>
  </footer>
</article>

<style>
.blog-post {
  max-width: 800px;
  margin: 0 auto;
  padding: 48px 24px;
}

.post-header {
  margin-bottom: 32px;
}

.post-header h1 {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
}

.post-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--gray-500);
  font-size: 0.9rem;
}

.post-tags {
  display: flex;
  gap: 8px;
}

.tag {
  background: var(--gray-200);
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 0.8rem;
  color: var(--gray-700);
}

.post-content {
  line-height: 1.8;
  font-size: 1.1rem;
}

.post-content h2 {
  margin-top: 32px;
  margin-bottom: 16px;
  font-size: 1.8rem;
}

.post-content p {
  margin-bottom: 24px;
}

.post-content ul, .post-content ol {
  margin-bottom: 24px;
  padding-left: 24px;
}

.post-content li {
  margin-bottom: 8px;
}

.post-footer {
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--gray-200);
}

.back-link {
  color: var(--secondary);
  text-decoration: none;
  font-weight: 600;
  transition: opacity 0.2s;
}

.back-link:hover {
  opacity: 0.8;
}

@media (max-width: 768px) {
  .blog-post {
    padding: 32px 16px;
  }
  
  .post-header h1 {
    font-size: 2rem;
  }
}
</style>
